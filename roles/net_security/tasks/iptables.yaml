---
- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    update_cache: true
    state: present

- name: Allow related and established connections
  ansible.builtin.iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT

- name: Create the user-defined chain LOGGING
  ansible.builtin.iptables:
    chain: LOGGING
    chain_management: true

- name: Add a redirection rule to LOGGING
  ansible.builtin.iptables:
    chain: INPUT
    jump: LOGGING

- name: Allow new connections via SSH
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ ssh_port }}"
    ctstate: NEW
    jump: ACCEPT
    source: "{{ allowed_ip }}"

- name: Allow ICMP echo requests
  ansible.builtin.iptables:
    chain: INPUT
    protocol: icmp
    jump: ACCEPT
    source: "{{ allowed_ip }}"
    icmp_type: 8

- name: Log invalid packets
  ansible.builtin.iptables:
    chain: LOGGING
    action: append
    limit: 2/min
    limit_burst: 4
    log_prefix: "IPTABLES INVALID:  "
    ctstate: INVALID

- name: Log dropped packets
  ansible.builtin.iptables:
    chain: LOGGING
    action: append
    limit: 2/min
    limit_burst: 4
    log_prefix: "IPTABLES DROP:  "

- name: Set the policy for the INPUT chain to DROP
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP

- name: Set the policy for the FORWARD chain to DROP
  ansible.builtin.iptables:
    chain: FORWARD
    policy: DROP

- name: Save rules
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4