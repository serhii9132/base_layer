---
- name: Find files in sshd_config.d
  ansible.builtin.find:
    paths: "{{ path_to_config }}"
    file_type: file
  register: list_files

- name: Delete the contents of sshd_config.d
  when: list_files.matched > 0
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ list_files.files }}"

- name: Create ssh group
  ansible.builtin.group:
    name: "{{ ssh_group }}"
    state: present

- name: Apply sshd-custom template
  ansible.builtin.template:
    src: sshd-custom.j2
    dest: "{{ path_to_config }}/{{ sshd_config }}"
    owner: root
    group: root
    mode: '644'
  notify: Restart ssh service
