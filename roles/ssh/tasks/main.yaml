---
- name: Find files in sshd_config.d
  ansible.builtin.find:
    paths: "{{ path_to_config }}"
    file_type: file
  register: list_files

- name: Delete ssh configs
  ansible.builtin.shell:
    cmd: "rm -f {{ path_to_config }}/*"
  when: list_files.matched > 0

- name: Create ssh group
  ansible.builtin.group:
    name: "{{ ssh_group }}"
    state: present

- name: Apply sshd-custom template
  ansible.builtin.template:
    src: sshd-custom.j2
    dest: "{{ path_to_config }}/{{ sshd_config }}"
    owner: root
    group: root
    mode: 0644
  notify: Restart ssh service