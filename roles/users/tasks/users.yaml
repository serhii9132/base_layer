---
- name: Remove stock users
  ansible.builtin.user:
    name: "{{ item }}" 
    state: absent
    remove: yes 
  loop: "{{ stock_users }}"

- name: Update root password
  no_log: true
  ansible.builtin.user:
    name: root
    password: "{{ root_pass }}"
  when: root_pass | length > 0

- name: Create a new user
  no_log: true 
  ansible.builtin.user:
    name: "{{ sudo_user }}"
    password: "{{ sudo_user_pass }}"
    shell: /bin/bash
    groups: 
      - sudo
      - "{{ ssh_group }}"
  when: sudo_user_pass | length > 0

- name: Copy .bashrc from template
  ansible.builtin.template:
    src: bashrc.j2
    dest: "{{ item.dir }}/.bashrc"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: 0644
  loop: 
    - { user: root, dir: /root }
    - { user: "{{ sudo_user }}", dir: "/home/{{ sudo_user }}"}

- name: Add key to user
  no_log: true
  ansible.builtin.authorized_key:
    user: "{{ sudo_user}}"
    state: present
    key: "{{ ssh_pub_key }}"
    exclusive: true
  when: ssh_pub_key | length > 0